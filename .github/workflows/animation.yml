name: animation-install
on:
  pull_request:
  push:
  workflow_dispatch:
jobs:
  clean-render:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: FFmpeg Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: FFmpeg macOS
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install from lockfile
        run: npm ci --no-audit --no-fund
      - name: Python
        run: python -m venv .venv && .venv/bin/pip install numpy
      - name: Unit tests
        run: .venv/bin/python -m unittest discover -s scripts/tests
      - name: Render profiles (production runtime and reverse seeks)
        run: .venv/bin/python -m scripts.tools.animation_matrix --formats particle-title,narrative-sequence --profiles restrained,balanced,energetic
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: animation-${{ runner.os }}
          path: work/animation-matrix/
